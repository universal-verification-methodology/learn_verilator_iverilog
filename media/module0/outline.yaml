- type: code
  title: Install verification — version checks
  language: bash
  source_file: scripts/install_iverilog.sh
  code: '#!/bin/bash


    # Icarus Verilog (iverilog) Installation Script

    # Installs iverilog from system package manager or builds from source

    # Usage: ./install_iverilog.sh [--system] [--source] [OPTIONS]


    set -euo pipefail


    # Colors for output

    RED=''\033[0;31m''

    GREEN=''\033[0;32m''

    YELLOW=''\033[1;33m''

    BLUE=''\033[0;34m''

    NC=''\033[0m'' # No Color


    # Get script directory

    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

    PROJECT_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"

    // ...'
  notes: Run install scripts once; verify with iverilog -v and verilator --version.
  narration: Install verification — version checks. Review the code on screen and
    match it to files in the repository. Run install scripts once; verify with iverilog
    -v and verilator --version.
