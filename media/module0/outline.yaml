- type: code
  title: Makefile — iverilog hello_world target
  language: makefile
  source_file: module0/examples/iverilog_basics/Makefile
  code: "hello_world: hello_world.v\n\t@echo \"Compiling hello_world...\"\n\t# Compile\
    \ Verilog file into executable\n\t# -o: output filename\n\t$(IVERILOG) -o hello_world\
    \ hello_world.v\n\t@echo \"Running hello_world...\"\n\t# Run compiled simulation\n\
    \t$(VVP) hello_world"
  notes: make hello_world runs iverilog then vvp from the example directory.
  narration: Makefile — iverilog hello_world target. Review the code on screen and
    match it to files in the repository. make hello_world runs iverilog then vvp from
    the example directory.
- type: code
  title: Verilator Makefile — build and run
  language: makefile
  source_file: module0/examples/verilator_basics/Makefile
  code: "hello_world: hello_world.v hello_world.cpp\n\t@echo \"Compiling hello_world\
    \ with Verilator...\"\n\t# Verilator generates C++ class from Verilog module\n\
    \t# Then compiles C++ testbench with generated code\n\t# Creates executable: ./obj_dir/Vhello_world\n\
    \t$(VERILATOR) $(VERILATOR_FLAGS) hello_world.v hello_world.cpp\n\t@echo \"Running\
    \ hello_world...\"\n\t# Execute the compiled simulation\n\t./obj_dir/Vhello_world"
  notes: VERILATOR_FLAGS --cc --exe --build; output binary under obj_dir/.
  narration: Verilator Makefile — build and run. Review the code on screen and match
    it to files in the repository. VERILATOR_FLAGS --cc --exe --build; output binary
    under obj_dir/.
- type: code
  title: GTKWave example — VCD generation
  language: systemverilog
  source_file: module0/examples/iverilog_basics/gtkwave_example.v
  code: "/**\n * GTKWave Usage Example for iverilog\n * \n * This testbench demonstrates:\n\
    \ * - VCD file generation\n * - Multiple signal types (clock, data, control)\n\
    \ * - Signal transitions for waveform analysis\n * - GTKWave viewing workflow\n\
    \ * \n * Usage:\n *   iverilog -o gtkwave_example gtkwave_example.v ../../dut/simple_gates/and_gate.v\n\
    \ *   vvp gtkwave_example\n *   gtkwave gtkwave_example.vcd\n */\n\n`timescale\
    \ 1ns/1ps\n\nmodule gtkwave_example;\n// ..."
  notes: $dumpfile and $dumpvars create VCD; open with gtkwave for debug.
  narration: GTKWave example — VCD generation. Review the code on screen and match
