- type: code
  title: iverilog — compile then simulate
  language: systemverilog
  source_file: module0/examples/iverilog_basics/hello_world.v
  code: "    initial begin\n        // $display is a system task that prints formatted\
    \ text to stdout\n        // Similar to printf() in C or print() in Python\n \
    \       $display(\"========================================\");\n        $display(\"\
    Hello World from Icarus Verilog!\");\n        $display(\"========================================\"\
    );\n        $display(\"If you see this message, iverilog is working correctly.\"\
    );\n        \n        // $time is a system function that returns current simulation\
    \ time\n        // %0t formats it as a decimal number (no leading zeros)\n   \
    \     $display(\"Time: %0t\", $time);\n        $display(\"========================================\"\
    );\n        \n        // #10 introduces a delay of 10 time units\n        // Default\
    \ time unit is typically 1ns (can be set with `timescale)"
  notes: 'Step 1: iverilog -o hello_world hello_world.v. Step 2: vvp hello_world.'
  narration: 'iverilog — compile then simulate. Review the code on screen and match
    it to files in the repository. Step 1: iverilog -o hello_world hello_world.v.
    Step 2: vvp hello_world.'
- type: code
  title: Verilator — C++ model and eval()
  language: cpp
  source_file: module0/examples/verilator_basics/hello_world.cpp
  code: "    Verilated::commandArgs(argc, argv);\n    \n    // Print test header\n\
    \    std::cout << \"========================================\" << std::endl;\n\
    \    std::cout << \"Hello World from Verilator!\" << std::endl;\n    std::cout\
    \ << \"========================================\" << std::endl;\n    std::cout\
    \ << \"If you see this message, Verilator is working correctly.\" << std::endl;\n\
    \    \n    /**\n     * Create DUT (Design Under Test) Instance\n     * \n    \
    \ * Verilator generates a C++ class for each Verilog module.\n     * Class naming\
    \ convention: V<module_name>\n     * \n     * For module \"hello_world\", Verilator\
    \ generates class \"Vhello_world\".\n     * \n     * The DUT object represents\
    \ the entire Verilog module:\n     * - Member variables: module ports (inputs,\
    \ outputs, inouts)\n// ..."
  notes: verilator --cc --exe --build; run ./obj_dir/Vhello_world; dut->eval() each
    step.
  narration: Verilator — C++ model and eval(). Review the code on screen and match
    it to files in the repository. verilator --cc --exe --build; run ./obj_dir/Vhello_world;
    dut->eval() each step.
- type: code
  title: Reference DUT — and_gate
  language: systemverilog
  source_file: module0/dut/simple_gates/and_gate.v
  code: "    always @(*) begin\n        // AND operation: y is 1 only when both a\
    \ and b are 1\n        // This is the fundamental AND gate behavior\n        y\
    \ = a & b;\n    end\n\nendmodule"
  notes: Flat combinational RTL; TB instantiates at top level for smoke tests.
  narration: Reference DUT — and_gate. Review the code on screen and match it to files
    in the repository. Flat combinational RTL; TB instantiates at top level for smoke
    tests.
