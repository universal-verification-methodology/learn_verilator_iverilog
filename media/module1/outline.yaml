- type: code
  title: Compilation Makefile — iverilog targets
  language: makefile
  source_file: module1/examples/compilation/Makefile
  code: "# Basic compilation\nbasic_compilation: basic_compilation.v\n\t@echo \"===\
    \ Basic Compilation ===\"\n\t$(IVERILOG) -o basic_compilation basic_compilation.v\n\
    \t$(VVP) basic_compilation\n\n# Compilation with include path\ninclude_path: basic_compilation.v\n\
    \t@echo \"=== Compilation with Include Path ===\"\n\t$(IVERILOG) -I$(DUT_DIR)\
    \ -o include_path basic_compilation.v\n\t$(VVP) include_path\n\n# Compilation\
    \ with macro definition\nmacro_def: basic_compilation.v\n\t@echo \"=== Compilation\
    \ with Macro Definition ===\"\n\t$(IVERILOG) -DDEBUG -o macro_def basic_compilation.v\n\
    \t$(VVP) macro_def\n"
  notes: iverilog elaborates RTL+TB into VVP bytecode; vvp runs the event scheduler.
  narration: Compilation Makefile — iverilog targets. Review the code on screen and
    match it to files in the repository. iverilog elaborates RTL+TB into VVP bytecode;
    vvp runs the event scheduler.
- type: code
  title: Verilog TB — DUT instantiation
  language: systemverilog
  source_file: module1/examples/testbench_basics/mux_4to1_test.v
  code: "module mux_4to1_test;\n\n    // ========================================================================\n\
    \    // Testbench Signal Declarations\n    // ========================================================================\n\
    \    // These signals connect to the DUT and are controlled by the testbench\n\
    \    \n    reg [1:0] sel;        // Select signal (2-bit, drives DUT input)\n\
    \    reg       in0, in1, in2, in3;  // Input signals (drive DUT inputs)\n    wire\
    \      out;        // Output signal (observes DUT output, wire because it's driven\
    \ by DUT)\n    reg       clk;        // Clock signal (for demonstration, not needed\
    \ for combinational logic)\n\n    // ========================================================================\n\
    \    // DUT (Design Under Test) Instantiation\n    // ========================================================================\n\
    \    // This is where we instantiate the module we want to test.\n    // In UVM,\
    \ this would be part of the test environment.\n    \n// ..."
  notes: Top module wires regs to DUT ports; initial blocks drive stimulus.
  narration: Verilog TB — DUT instantiation. Review the code on screen and match it
    to files in the repository. Top module wires regs to DUT ports; initial blocks
    drive stimulus.
- type: code
  title: VVP simulation Makefile
  language: makefile
  source_file: module1/examples/simulation/Makefile
  code: "vvp_basics: vvp_basics.v\n\t@echo \"=== Compiling vvp_basics ===\"\n\t$(IVERILOG)\
    \ -o vvp_basics vvp_basics.v\n\t@echo \"=== Running simulation ===\"\n\t$(VVP)\
    \ vvp_basics\n\t@echo \"=== Running with verbose mode ===\"\n\t$(VVP) -v vvp_basics"
  notes: Compile to named binary, then vvp executes the bytecode simulator.
  narration: VVP simulation Makefile. Review the code on screen and match it to files
    in the repository. Compile to named binary, then vvp executes the bytecode simulator.
- type: code
  title: DUT — mux_4to1 select logic
  language: systemverilog
  source_file: module1/dut/multiplexers/mux_4to1.v
  code: "module mux_4to1(\n    input  wire [1:0] sel,  // 2-bit select signal\n  \
    \  input  wire       in0,  // Input 0\n    input  wire       in1,  // Input 1\n\
    \    input  wire       in2,  // Input 2\n    input  wire       in3,  // Input\
    \ 3\n    output reg        out   // Output (must be reg for procedural assignment)\n\
    );\n\n    /**\n     * Combinational Logic: 4-to-1 Multiplexer\n     * \n     *\
    \ This always block implements the multiplexer logic using a case statement.\n\
    \     * The always @(*) syntax means this block is sensitive to all signals used\n\
    \     * in the right-hand side (sel, in0, in1, in2, in3), making it combinational.\n\
    \     * \n     * Key Concepts:\n     * - always @(*) creates combinational logic\
    \ (no clock needed)\n// ..."
  notes: Combinational case(sel) drives out; exercised by directed vectors.
  narration: DUT — mux_4to1 select logic. Review the code on screen and match it to
    files in the repository. Combinational case(sel) drives out; exercised by directed
    vectors.
