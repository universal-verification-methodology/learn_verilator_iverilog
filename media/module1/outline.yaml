- type: code
  title: Self-check — expected vs actual
  language: systemverilog
  source_file: module1/examples/testbench_basics/mux_4to1_test.v
  code: "        // Print test table header\n        $display(\"\\nTesting all select\
    \ combinations:\");\n        $display(\"sel | in0 | in1 | in2 | in3 | out | Expected\"\
    );\n        $display(\"----|-----|-----|-----|-----|-----|----------\");\n   \
    \     \n        // ====================================================================\n\
    \        // Test Case 1: Select in0 (sel=00)\n        // ====================================================================\n\
    \        // Strategy: Set in0=1, all others=0, sel=00, verify out=in0\n      \
    \  sel = 2'b00; \n        in0 = 1'b1;  // Set input 0 high\n        in1 = 1'b0;\
    \ \n        in2 = 1'b0; \n        in3 = 1'b0;\n        #5;  // Wait for combinational\
    \ logic to propagate (though it's instant)\n        \n        // $strobe prints\
    \ at the END of the current time step (after all assignments)\n        // This\
    \ ensures we see the final, stable values\n// ..."
  notes: Inline if (expected !== actual); final summary before $finish.
  narration: Self-check — expected vs actual. Review the code on screen and match
    it to files in the repository. Inline if (expected !== actual); final summary
    before $finish.
