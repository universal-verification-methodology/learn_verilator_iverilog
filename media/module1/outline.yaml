- type: code
  title: Self-checking stimulus loop
  language: systemverilog
  source_file: module1/examples/testbench_basics/mux_4to1_test.v
  code: "    // \n    // Test Strategy:\n    // - Exhaustive testing: Test all 4 select\
    \ combinations\n    // - For each select value, set the corresponding input high,\
    \ others low\n    // - Verify that output matches the selected input\n    // \n\
    \    // This pattern (stimulus → wait → check) is fundamental to all verification:\n\
    \    // 1. Apply stimulus (set inputs)\n    // 2. Wait for propagation (combinational\
    \ logic settles immediately, but we wait for clarity)\n    // 3. Check result\
    \ (compare output to expected value)\n    // 4. Report pass/fail\n    // \n  \
    \  // In UVM: This evolves into:\n    // - Sequences generate transactions (stimulus)\n\
    \    // - Drivers apply transactions to DUT\n    // - Monitors capture DUT responses\n\
    \    // - Scoreboards compare expected vs. actual\n    \n// ..."
  notes: Apply sel/in patterns, compare out, increment error count, $finish.
  narration: Self-checking stimulus loop. Review the code on screen and match it to
    files in the repository. Apply sel/in patterns, compare out, increment error count,
    $finish.
