- type: two_column
  title: 1. iverilog compile-and-run architecture
  left:
  - 'Sources: RTL under `module1/dut/` plus testbench under `examples/` or `tests/`'
  - 'Compile: `iverilog` elaborates modules, produces a VVP bytecode executable'
  - 'Simulate: `vvp` drives the event scheduler; `$dumpvars` can emit VCD'
  - 'Artifacts: `simv` (or custom name), `*.vcd`, compile logs in example directories'
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE1 Design Architecture.
  narration: '1. iverilog compile-and-run architecture. Sources: RTL under module1/dut/
    plus testbench under examples/ or tests/ Compile: iverilog elaborates modules,
    produces a VVP bytecode executable Simulate: vvp drives the event scheduler; $dumpvars
    can emit VCD Artifacts: simv (or custom name), *.vcd, compile logs in example
    directories Refer to the diagram on the right.'
- type: two_column
  title: 2. Module 1 DUT catalog
  left:
  - '`dut/multiplexers/`: `mux_2to1`, `mux_4to1` — select lines, combinational outputs'
  - '`dut/counters/`: `counter_4bit` — clock, reset, enable, parallel load'
  - 'Interface pattern: Clock + reset on sequential blocks; data ports on combinational
    paths'
  - 'Reuse: Same DUTs exercised across compilation, simulation, and testbench examples'
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE1 Design Architecture.
  narration: '2. Module 1 DUT catalog. dut/multiplexers/: mux_2to1, mux_4to1 — select
    lines, combinational outputs dut/counters/: counter_4bit — clock, reset, enable,
    parallel load Interface pattern: Clock + reset on sequential blocks; data ports
    on combinational paths Reuse: Same DUTs exercised across compilation, simulation,
    and testbench examples Refer to the diagram on the right.'
- type: two_column
  title: 3. Verilog testbench structure (iverilog)
  left:
  - 'Top: `module tb;` instantiates DUT, declares wires/regs for connectivity'
  - 'Stimulus: `initial` blocks and tasks drive inputs over simulation time'
  - 'Observation: `$display`, `$monitor`, and VCD for passive debug'
  - 'Closure: `$finish` after pass/fail counts or explicit timeout'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE1 Design Architecture.
  narration: '3. Verilog testbench structure (iverilog). Top: module tb; instantiates
    DUT, declares wires/regs for connectivity Stimulus: initial blocks and tasks drive
    inputs over simulation time Observation: $display, $monitor, and VCD for passive
    debug Closure: $finish after pass/fail counts or explicit timeout Refer to the
    diagram on the right.'
