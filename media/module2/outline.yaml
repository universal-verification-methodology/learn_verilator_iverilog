- type: two_column
  title: 1. Verilator compilation model
  left:
  - 'Input: Verilog/SystemVerilog RTL + optional `--timing` / lint flags per example'
  - 'Output: C++ classes (`V<top>`) in `obj_dir/` with fast cycle-accurate `eval()`'
  - 'Linkage: C++ `main()` or test class calls `dut->eval()` each cycle or on events'
  - 'Tracing: `--trace` / `--trace-fst` for waveform dumps from the C++ side'
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE2 Design Architecture.
  narration: '1. Verilator compilation model. Input: Verilog/SystemVerilog RTL + optional
    --timing / lint flags per example Output: C++ classes (V<top>) in obj_dir/ with
    fast cycle-accurate eval() Linkage: C++ main() or test class calls dut->eval()
    each cycle or on events Tracing: --trace / --trace-fst for waveform dumps from
    the C++ side Refer to the diagram on the right.'
- type: two_column
  title: 2. Module 2 DUT catalog
  left:
  - '`dut/multiplexers/`: Same MUX family as Module 1 — cross-tool comparison baseline'
  - '`dut/counters/`: `counter_4bit` — exercises sequential C++ drive/monitor loops'
  - 'Port mapping: Verilator flattens ports to struct members (`dut->clk`, `dut->count`)'
  - 'Performance: Large test suites favor Verilator’s compiled model over interpreted
    VVP'
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE2 Design Architecture.
  narration: '2. Module 2 DUT catalog. dut/multiplexers/: Same MUX family as Module
