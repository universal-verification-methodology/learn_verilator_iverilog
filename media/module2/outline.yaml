    \    // TEST 3: Enable/Disable Control\n    // ========================================================================\n\
    \    // Verify that when en=0, counter holds its value (doesn't increment).\n\
    \    std::cout << \"\\nTest 3: Disable counting (en=0)\" << std::endl;\n    dut->en\
