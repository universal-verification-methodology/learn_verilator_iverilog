- type: code
  title: Assert-based checking
  language: cpp
  source_file: module2/examples/cpp_testbench/mux_4to1_test.cpp
  code: "    // Assertion: If condition is false, program aborts with error message.\n\
    \    // This is a simple but effective way to catch bugs early.\n    // In production\
    \ testbenches, you might want more sophisticated checking.\n    assert(dut->out\
    \ == dut->in0 && \"Test failed: sel=00 should select in0\");\n    \n    // ========================================================================\n\
    \    // TEST CASE 2: sel=01 (binary), select in1\n    // ========================================================================\n\
    \    dut->sel = 1;  // 2-bit select: 01 selects in1\n    dut->in0 = 0; dut->in1\
    \ = 1; dut->in2 = 0; dut->in3 = 0;\n    dut->eval();  // Evaluate combinational\
    \ logic\n    std::cout << \" \" << (int)dut->sel << \"  |  \" << (int)dut->in0\
    \ \n              << \"  |  \" << (int)dut->in1 << \"  |  \" << (int)dut->in2\
    \ \n              << \"  |  \" << (int)dut->in3 << \"  |  \" << (int)dut->out\
    \ \n              << \"  |   in1\" << std::endl;\n    assert(dut->out == dut->in1\
    \ && \"Test failed: sel=01 should select in1\");\n    \n    // ========================================================================\n\
    // ..."
  notes: assert() on mismatch; All tests passed on stdout at end.
  narration: Assert-based checking. Review the code on screen and match it to files
    in the repository. assert() on mismatch; All tests passed on stdout at end.
