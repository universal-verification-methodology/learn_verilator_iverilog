- type: code
  title: Verilator compile flags
  language: makefile
  source_file: module2/examples/compilation/Makefile
  code: "VERILATOR = verilator\nDUT_DIR = ../../dut\n\n# Common flags for compilation\
    \ targets (not used for linting)\nVERILATOR_FLAGS = --cc --exe --build\n\n# Default\
    \ target: run all compilation examples\nall: basic_compilation optimization tracing\
    \ coverage linting\n\n# ============================================================================\n\
    # Basic Compilation\n# ============================================================================\n\
    # Minimal compilation with only required flags.\n# This is the simplest way to\
    \ compile a Verilator testbench.\nbasic_compilation: basic_compilation.v basic_compilation.cpp\n\
    \t@echo \"=== Basic Compilation ===\"\n\t$(VERILATOR) $(VERILATOR_FLAGS) basic_compilation.v\
    \ basic_compilation.cpp\n\t@echo \"=== Running ===\"\n// ..."
  notes: verilator --cc --exe --build emits obj_dir/ with Vmodule and Makefile.
  narration: Verilator compile flags. Review the code on screen and match it to files
    in the repository. verilator --cc --exe --build emits obj_dir/ with Vmodule and
    Makefile.
- type: code
  title: C++ TB — init, eval, final
  language: cpp
  source_file: module2/examples/cpp_testbench/mux_4to1_test.cpp
  code: "int main(int argc, char** argv) {\n    // ========================================================================\n\
    \    // STEP 1: Initialize Verilator\n    // ========================================================================\n\
    \    // Verilated::commandArgs() processes command-line arguments that Verilator\n\
    \    // understands (e.g., --trace, --coverage). This must be called before\n\
    \    // creating any Verilator objects. It's safe to pass argc/argv even if\n\
    \    // you don't use Verilator-specific arguments.\n    Verilated::commandArgs(argc,\
    \ argv);\n    \n    std::cout << \"========================================\"\
    \ << std::endl;\n    std::cout << \"4-to-1 Multiplexer C++ Testbench\" << std::endl;\n\
    \    std::cout << \"========================================\" << std::endl;\n\
    \    \n    // ========================================================================\n\
    \    // STEP 2: Create DUT (Design Under Test) Instance\n    // ========================================================================\n\
    \    // Verilator generates a C++ class named V<module_name> for each top-level\n\
    // ..."
  notes: Verilated::commandArgs, new Vmodule, dut->eval(), dut->final().
  narration: C++ TB — init, eval, final. Review the code on screen and match it to
    files in the repository. Verilated::commandArgs, new Vmodule, dut->eval(), dut->final().
- type: code
  title: obj_dir layout after verilator
  language: makefile
  source_file: module2/examples/cpp_testbench/Makefile
  code: "# ============================================================================\n\
    # Multiplexer Testbench Target\n# ============================================================================\n\
    # Builds and runs the 4-to-1 multiplexer testbench.\n# \n# Build steps:\n#   1.\
    \ Verilator generates C++ wrapper from mux_4to1.v\n#   2. Compiles testbench with\
    \ generated wrapper\n#   3. Links into executable: obj_dir/Vmux_4to1\n#   4. Runs\
    \ the executable\nmux_4to1_test: mux_4to1_test.cpp\n\t@echo \"=== Compiling mux_4to1_test\
    \ ===\"\n\t# -I flag adds include directory for `include directives in Verilog\n\
    \t# Use full path to file, -I points to parent directory for includes\n\t$(VERILATOR)\
    \ $(VERILATOR_FLAGS) -I$(DUT_DIR)/multiplexers \\\n\t\t$(DUT_DIR)/multiplexers/mux_4to1.v\
    \ mux_4to1_test.cpp\n\t@echo \"=== Running simulation ===\"\n\t# Executable is\
    \ in obj_dir/ with name V<module_name>\n// ..."
  notes: make mux_4to1_test compiles and runs ./obj_dir/Vmux_4to1.
  narration: obj_dir layout after verilator. Review the code on screen and match it
    to files in the repository. make mux_4to1_test compiles and runs ./obj_dir/Vmux_4to1.
- type: code
  title: DUT ports as C++ members
  language: cpp
  source_file: module2/examples/cpp_testbench/mux_4to1_test.cpp
  code: "    //\n    // Note: For sequential logic (flip-flops, counters), we need\
    \ clock cycles.\n    // See counter_test.cpp for sequential logic examples.\n\
    \    \n    std::cout << \"\\nTesting all select combinations:\" << std::endl;\n\
    \    std::cout << \"sel | in0 | in1 | in2 | in3 | out | Expected\" << std::endl;\n\
    \    std::cout << \"----|-----|-----|-----|-----|-----|----------\" << std::endl;\n\
    \    \n    // ========================================================================\n\
    \    // TEST CASE 1: sel=00 (binary), select in0\n    // ========================================================================\n\
    \    // Strategy: Set only in0=1, others=0. If mux works, out should equal in0.\n\
    \    dut->sel = 0;  // 2-bit select: 00 selects in0\n    dut->in0 = 1; dut->in1\
    \ = 0; dut->in2 = 0; dut->in3 = 0;\n    \n    // eval() evaluates all combinational\
    \ logic in the design. For a mux,\n    // this propagates the selected input to\
    \ the output. Must call eval()\n    // after changing inputs and before reading\
    \ outputs!\n// ..."
  notes: Write dut->sel and inputs, call eval(), read dut->out.
  narration: DUT ports as C++ members. Review the code on screen and match it to files
    in the repository. Write dut->sel and inputs, call eval(), read dut->out.
