- type: section
  title: Key concepts
  narration: 'Next section: Key concepts.'
- type: bullets
  title: 1. Canonical testbench–DUT boundary
  bullets:
  - 'DUT: Device Under Test in `module3/dut/` (gates, multiplexers, counters)'
  - 'TB wrapper: Encapsulates instantiation, clock/reset, and test program only'
  - 'Signals: Explicit wires/regs (Verilog) or model ports (C++) — no hidden coupling'
  - 'Lifecycle: Build → reset → run tests → report → `$finish` / `return` exit code'
  notes: From MODULE3 Key Concepts.
  narration: '1. Canonical testbench–DUT boundary. DUT: Device Under Test in module3/dut/
    (gates, multiplexers, counters) TB wrapper: Encapsulates instantiation, clock/reset,
    and test program only Signals: Explicit wires/regs (Verilog) or model ports (C++)
    — no hidden coupling Lifecycle: Build → reset → run tests → report → $finish /
    return exit code'
- type: bullets
  title: 2. Dual-paradigm environment architecture
  bullets:
  - 'Verilog TB (`examples/verilog_testbenches/`): Event-driven `initial`/`always`'
  - 'C++ TB (`examples/cpp_testbenches/`): `eval()` loop with Verilator model'
  - 'Shared DUT: Same RTL verified two ways — highlights tool-specific TB idioms'
  - 'Comparison guide: `examples/comparison/` documents mapping between styles'
  notes: From MODULE3 Key Concepts.
  narration: '2. Dual-paradigm environment architecture. Verilog TB (examples/verilog_testbenches/):
    Event-driven initial/always C++ TB (examples/cpp_testbenches/): eval() loop with
    Verilator model Shared DUT: Same RTL verified two ways — highlights tool-specific
    TB idioms Comparison guide: examples/comparison/ documents mapping between styles'
- type: bullets
  title: 3. Verification component roles (UVM-aligned)
  bullets:
  - 'Driver: Applies stimulus (assignments before `eval` or `#delay`)'
  - 'Monitor: Samples outputs; logs transactions or pin values'
  - 'Scoreboard: Compares actual vs expected; increments pass/fail'
  - 'Clock/reset agents: Reusable blocks generating periodic clock and reset sequences'
  notes: From MODULE3 Key Concepts.
  narration: '3. Verification component roles (UVM-aligned). Driver: Applies stimulus
    (assignments before eval or #delay) Monitor: Samples outputs; logs transactions
    or pin values Scoreboard: Compares actual vs expected; increments pass/fail Clock/reset
    agents: Reusable blocks generating periodic clock and reset sequences'
- type: bullets
  title: 1. Structured test flow (build–connect–run)
  bullets:
  - 'Build: Compile RTL + TB; elaborate hierarchy'
  - 'Connect: Port map DUT; tie off unused inputs'
  - 'Run: Execute directed cases (AND truth table, counter wrap, MUX exhaust)'
  - 'Cleanup: Close files, print summary, non-zero exit on failure'
  notes: From MODULE3 Key Concepts.
  narration: '1. Structured test flow (build–connect–run). Build: Compile RTL + TB;
    elaborate hierarchy Connect: Port map DUT; tie off unused inputs Run: Execute
    directed cases (AND truth table, counter wrap, MUX exhaust) Cleanup: Close files,
    print summary, non-zero exit on failure'
- type: bullets
  title: 2. Directed and exhaustive patterns
  bullets:
  - 'Truth-table tests: All input combinations for small combinational DUTs'
  - 'Sequential tests: Known count sequences after reset deassert'
  - 'Assertions: `assert` (C++) or immediate checks (Verilog) on each vector'
  notes: From MODULE3 Key Concepts.
  narration: '2. Directed and exhaustive patterns. Truth-table tests: All input combinations
    for small combinational DUTs Sequential tests: Known count sequences after reset
    deassert Assertions: assert (C++) or immediate checks (Verilog) on each vector'
- type: bullets
  title: 3. Cross-paradigm verification discipline
  bullets:
  - 'Same spec, two TBs: Document expected behavior once; implement in Verilog and
    C++'
  - 'Self-checking: Both paradigms count errors locally — no manual waveform grading'
  - 'Orchestration: `./scripts/module3.sh --verilog-testbenches` vs `--cpp-testbenches`'
  notes: From MODULE3 Key Concepts.
  narration: '3. Cross-paradigm verification discipline. Same spec, two TBs: Document
    expected behavior once; implement in Verilog and C++ Self-checking: Both paradigms
    count errors locally — no manual waveform grading Orchestration: ./scripts/module3.sh
    --verilog-testbenches vs --cpp-testbenches'
