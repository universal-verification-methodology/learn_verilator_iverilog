- type: code
  title: C++ TB Makefile — Verilator build
  language: makefile
  source_file: module3/examples/cpp_testbenches/Makefile
  code: "counter_test: counter_test.cpp\n\t@echo \"=== Compiling counter_test ===\"\
    \n\t$(VERILATOR) $(VERILATOR_FLAGS) -I$(DUT_DIR_MODULE1)/counters \\\n\t\t$(DUT_DIR_MODULE1)/counters/counter_4bit.v\
    \ counter_test.cpp\n\t@echo \"=== Running simulation ===\"\n\t./obj_dir/Vcounter_4bit"
  notes: cd module3/examples/cpp_testbenches && make counter_test
  narration: C++ TB Makefile — Verilator build. Review the code on screen and match
    it to files in the repository. cd module3/examples/cpp_testbenches && make counter_test
- type: code
  title: C++ TB — DUT init and reset test
  language: cpp
  source_file: module3/examples/cpp_testbenches/counter_test.cpp
  code: "int main(int argc, char** argv) {\n    // ========================================================================\n\
    \    // VERILATOR INITIALIZATION\n    // ========================================================================\n\
    \    Verilated::commandArgs(argc, argv);\n    \n    // ========================================================================\n\
    \    // TEST HEADER\n    // ========================================================================\n\
    \    std::cout << \"========================================\" << std::endl;\n\
    \    std::cout << \"4-bit Counter C++ Testbench\" << std::endl;\n    std::cout\
    \ << \"========================================\" << std::endl;\n    \n    //\
    \ ========================================================================\n \
    \   // DUT (DESIGN UNDER TEST) INSTANTIATION\n    // ========================================================================\n\
    \    Vcounter_4bit* dut = new Vcounter_4bit;\n    \n// ..."
  notes: new Vcounter_4bit; drive rst_n low; eval loop verifies count==0.
  narration: C++ TB — DUT init and reset test. Review the code on screen and match
    it to files in the repository. new Vcounter_4bit; drive rst_n low; eval loop verifies
    count==0.
