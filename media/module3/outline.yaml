- type: code
  title: Verilog TB Makefile — counter_test
  language: makefile
  source_file: module3/examples/verilog_testbenches/Makefile
  code: "counter_test: counter_test.v\n\t@echo \"=== Compiling counter_test ===\"\n\
    \t$(IVERILOG) -o counter_test counter_test.v $(DUT_DIR_MODULE1)/counters/counter_4bit.v\n\
    \t@echo \"=== Running simulation ===\"\n\t$(VVP) counter_test"
  notes: iverilog links TB + counter_4bit.v; vvp runs event-driven simulation.
  narration: Verilog TB Makefile — counter_test. Review the code on screen and match
    it to files in the repository. iverilog links TB + counter_4bit.v; vvp runs event-driven
    simulation.
- type: code
  title: Verilog TB — clock and reset
  language: systemverilog
  source_file: module3/examples/verilog_testbenches/counter_test.v
  code: "\nmodule counter_test;\n\n    // ========================================================================\n\
    \    // TESTBENCH SIGNAL DECLARATIONS\n    // ========================================================================\n\
    \    // Clock signal - driven by always block (continuous clock generation)\n\
    \    reg       clk;\n    \n    // Reset signal (active-low: 0 = reset, 1 = normal\
    \ operation)\n    // Active-low resets are common in digital design\n    reg \
    \      rst_n;\n    \n    // Enable signal (1 = count, 0 = hold current value)\n\
    \    reg       en;\n    \n    // Counter output (4-bit: values 0-15)\n    // 'wire'\
    \ type because it's driven by DUT\n// ..."
  notes: 'always #half clk=~clk; reset sequence in initial block.'
  narration: 'Verilog TB — clock and reset. Review the code on screen and match it
    to files in the repository. always #half clk=~clk; reset sequence in initial block.'
- type: code
  title: Shared DUT — counter_4bit
  language: systemverilog
  source_file: module1/dut/counters/counter_4bit.v
  code: "/**\n * 4-bit Counter Design Under Test (DUT)\n * \n * This is a synchronous\
    \ 4-bit counter with reset and enable, used for learning\n * testbench development.\
    \ This module demonstrates sequential logic, which requires\n * clock-based testbench\
    \ patterns and is more complex to verify than combinational logic.\n * \n * Verification\
    \ Context:\n * - Sequential logic requires clock generation and timing control\
    \ in testbenches\n * - Demonstrates reset sequences, enable control, and state\
    \ observation\n * - In UVM, sequential logic like counters are used to learn transaction-based\n\
    \ *   verification, clocking blocks, and sequence generation\n * - This counter\
    \ can count from 0 to 15 (2^4 - 1), then wraps to 0\n * \n * @module counter_4bit\n\
    \ * @param clk Clock signal (positive edge triggered)\n * @param rst_n Active-low\
    \ reset signal (asynchronous reset, synchronous release)\n * @param en Enable\
    \ signal (counter increments only when en=1)\n// ..."
  notes: Same RTL verified by both Verilog and C++ testbench paradigms.
  narration: Shared DUT — counter_4bit. Review the code on screen and match it to
    files in the repository. Same RTL verified by both Verilog and C++ testbench paradigms.
