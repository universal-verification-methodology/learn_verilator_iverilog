- type: bullets
  title: Directed test execution sequence (1)
  bullets:
  - Reference model in TB
  - compare each cycle
  - aggregate pass/fail before $finish
  - Build clk/rst generators
  - connect DUT
  notes: Follow this order when tracing waveforms or debugging.
  narration: Follow these steps in order when working through this module. Reference
    model in TB compare each cycle aggregate pass/fail before $finish Build clk/rst
    generators connect DUT Follow this order when tracing waveforms or debugging.
- type: bullets
  title: Directed test execution sequence (2)
  bullets:
  - drive ALU/FIFO vectors
  - reference model compare
  - wire agents at top
  notes: Follow this order when tracing waveforms or debugging.
  narration: Follow these steps in order when working through this module. drive ALU/FIFO
    vectors reference model compare wire agents at top Follow this order when tracing
    waveforms or debugging.
- type: code
  title: Self-checking example build
  language: makefile
  source_file: module4/examples/self_checking/Makefile
  code: "# Makefile for self-checking testbench examples\n\nIVERILOG = iverilog\n\
    VVP = vvp\nVERILATOR = verilator\nDUT_DIR = ../../../module4/dut\n\nall: alu_self_checking_verilog\
    \ alu_self_checking_cpp\n\nalu_self_checking_verilog: alu_self_checking_verilog.v\n\
    \t@echo \"=== Compiling Verilog self-checking testbench ===\"\n\t$(IVERILOG) -o\
    \ alu_self_checking alu_self_checking_verilog.v $(DUT_DIR)/alus/simple_alu.v\n\
    \t@echo \"=== Running simulation ===\"\n\t$(VVP) alu_self_checking\n\nalu_self_checking_cpp:\
    \ alu_self_checking_cpp.cpp\n\t@echo \"=== Compiling C++ self-checking testbench\
    \ ===\"\n\t$(VERILATOR) --cc --exe --build -I$(DUT_DIR)/alus \\\n// ..."
  notes: cd module4/examples/self_checking && make
  narration: Self-checking example build. Review the code on screen and match it to
    files in the repository. cd module4/examples/self_checking && make
- type: code
  title: Reference model function
  language: systemverilog
  source_file: module4/examples/self_checking/alu_self_checking_verilog.v
  code: "    /**\n     * Design Under Test (DUT)\n     * \n     * Instantiate the\
    \ ALU module being verified.\n     * All signals are connected by name for clarity.\n\
    \     */\n    simple_alu dut (\n        .a(a),\n        .b(b),\n        .op(op),\n\
    \        .result(result),\n        .zero(zero)\n    );\n    \n    // ========================================\n\
    \    // Reference Model\n    // ========================================\n   \
    \ /**\n// ..."
  notes: calculate_expected(op,a,b) — golden model in TB.
  narration: Reference model function. Review the code on screen and match it to files
    in the repository. calculate_expected(op,a,b) — golden model in TB.
- type: section
  title: Verification & testing methods
  narration: 'Next section: Verification & testing methods.'
- type: two_column
  title: 1. Component-level verification
  left:
  - 'Stimulus module: Encapsulates write sequences to FIFO or register ports'
  - 'Monitor module: Captures read data and status flags passively'
  - 'Checker: Flags protocol violations (overflow, X on outputs, wrong opcode result)'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE4 Verification & Testing Methods.
  narration: '1. Component-level verification. Stimulus module: Encapsulates write
    sequences to FIFO or register ports Monitor module: Captures read data and status
    flags passively Checker: Flags protocol violations (overflow, X on outputs, wrong
    opcode result) Refer to the diagram on the right.'
- type: two_column
  title: 2. Scenario-based testing
  left:
  - 'Scenarios: Reset + fill FIFO; ALU op sweep; register R/W hazard patterns'
  - 'Tasks/methods: Each scenario is a callable task — reusable across tests'
  - 'Aggregation: Single report summarizing scenarios run and failures'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE4 Verification & Testing Methods.
  narration: '2. Scenario-based testing. Scenarios: Reset + fill FIFO; ALU op sweep;
    register R/W hazard patterns Tasks/methods: Each scenario is a callable task —
    reusable across tests Aggregation: Single report summarizing scenarios run and
    failures Refer to the diagram on the right.'
- type: two_column
  title: 3. Structured debug and closure
  left:
  - 'Modular debug: Isolate failing agent by disabling others in top TB'
  - 'Waveform on demand: Trigger dumps only when checker fires'
  - 'Regression: `./scripts/module4.sh --self-checking` and `--all-tests` for batch
    sign-off'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE4 Verification & Testing Methods.
  narration: '3. Structured debug and closure. Modular debug: Isolate failing agent
    by disabling others in top TB Waveform on demand: Trigger dumps only when checker
    fires Regression: ./scripts/module4.sh --self-checking and --all-tests for batch
    sign-off Refer to the diagram on the right.'
- type: code
  title: Modular TB — checker module
  language: systemverilog
  source_file: module4/examples/modular_testbenches/register_file_test_verilog.v
  code: "/**\n * Modular Register File Verilog Testbench\n * \n * This testbench demonstrates\
    \ the UVM-inspired separation of concerns pattern,\n * where testbench functionality\
    \ is divided into distinct, reusable components:\n * - Stimulus Generator: Drives\
    \ inputs to the DUT\n * - Monitor: Observes and logs DUT behavior\n * - Checker:\
    \ Validates DUT outputs against expected values\n * \n * Learning Objectives:\n\
    \ * - Understand modular testbench architecture\n * - Learn separation of concerns\
    \ in verification\n * - Master Verilog module-based testbench organization\n *\
    \ - Understand stimulus generation patterns\n * - Learn monitoring and checking\
    \ strategies\n * \n * UVM Pattern Inspiration:\n * This structure mirrors UVM's\
    \ agent architecture:\n// ..."
  notes: Separate stimulus, monitor, and checker blocks wired at top.
  narration: Modular TB — checker module. Review the code on screen and match it to
    files in the repository. Separate stimulus, monitor, and checker blocks wired
    at top.
