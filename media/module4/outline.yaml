- type: code
  title: Clock/reset Makefile target
  language: makefile
  source_file: module4/examples/clock_reset/Makefile
  code: "configurable_clock_reset_verilog: configurable_clock_reset_verilog.v\n\t\
    @echo \"=== Compiling Verilog clock/reset example ===\"\n\t$(IVERILOG) -o configurable_clock_reset\
    \ configurable_clock_reset_verilog.v\n\t@echo \"=== Running simulation ===\"\n\
    \t$(VVP) configurable_clock_reset"
  notes: Parameterize period; compile and vvp in one make target.
  narration: Clock/reset Makefile target. Review the code on screen and match it to
    files in the repository. Parameterize period; compile and vvp in one make target.
- type: code
  title: Configurable clock generation
  language: systemverilog
  source_file: module4/examples/clock_reset/configurable_clock_reset_verilog.v
  code: "    parameter CLK_PERIOD_1 = 20;  // 20ns period = 50MHz\n    parameter CLK_PERIOD_2\
    \ = 40;  // 40ns period = 25MHz\n    parameter RST_DURATION = 100; // Reset duration\
    \ in ns (5 clock cycles at 50MHz)\n    \n    // ========================================\n\
    \    // Signal Declarations\n    // ========================================\n\
    \    /**\n     * Clock Signals\n     * \n     * Two independent clock signals\
    \ for multi-clock domain testing.\n     * Each clock has its own period and runs\
    \ independently.\n     */\n    reg clk1;  // Clock 1 (50MHz by default)\n    reg\
    \ clk2;  // Clock 2 (25MHz by default)\n    \n    /**\n     * Reset Signal\n//\
    \ ..."
  notes: 'forever #(PERIOD/2) clk=~clk; coordinated reset release.'
  narration: 'Configurable clock generation. Review the code on screen and match it
    to files in the repository. forever #(PERIOD/2) clk=~clk; coordinated reset release.'
- type: code
  title: Self-checking ALU ports
  language: systemverilog
  source_file: module4/examples/self_checking/alu_self_checking_verilog.v
  code: "module alu_self_checking_verilog;\n\n    // ========================================\n\
    \    // Signal Declarations\n    // ========================================\n\
    \    /**\n     * DUT Input Signals\n     * \n     * These signals drive the ALU\
    \ inputs.\n     */\n    reg [7:0] a, b;    // Operands A and B (8 bits each)\n\
    \    reg [1:0] op;     // Operation code (00=ADD, 01=SUB, 10=AND, 11=OR)\n   \
    \ \n    /**\n     * DUT Output Signals\n     * \n     * These signals are driven\
    \ by the ALU outputs.\n     */\n// ..."
  notes: simple_alu instantiated; wires for a, b, op, result, zero.
  narration: Self-checking ALU ports. Review the code on screen and match it to files
    in the repository. simple_alu instantiated; wires for a, b, op, result, zero.
