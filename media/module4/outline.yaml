- type: bullets
  title: Overview
  bullets:
  - This module focuses on building well-structured testbenches for both Verilog and
    C++ paradigms. You'll learn to organize testbenches into reusable components,
    create test scenarios, and implement proper verification patt
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 4: DUT / block hierarchy (see module4/examples/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 4: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. Structured DUT portfolio (Module 4)
  bullets:
  - '`dut/alus/simple_alu.v`: Combinational ALU — op select, result, zero flag'
  - '`dut/fifos/simple_fifo.v`: Queue storage with full/empty and pointer logic'
  - '`dut/registers/register_file.v`: Multi-port register file — read/write ports,
    clocked updates'
  - 'Complexity step: Moves from gates/counters to datapath blocks needing organized
    TBs'
  notes: From MODULE4 Design Architecture.
- type: bullets
  title: 2. Modular testbench architecture
  bullets:
  - 'Separation: Stimulus generator, monitor, checker/scoreboard as distinct modules
    or classes'
  - 'Clock/reset generator: Dedicated block (`clock_reset` examples) — configurable
    period'
  - 'Hierarchy: Top TB instantiates agents + DUT; connects via named interfaces (wires)'
  - 'C++ mirror: Same roles as C++ classes with methods `drive()`, `sample()`, `check()`'
  notes: From MODULE4 Design Architecture.
- type: bullets
  title: 3. Reference model placement
  bullets:
  - 'Golden model: Software replica of ALU/FIFO/register behavior in TB'
  - 'Self-checking path: DUT output compared to reference each cycle or transaction'
  - 'Config: Parameters for width, depth, and clock period without editing DUT RTL'
  notes: From MODULE4 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 4: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Component-level verification
  bullets:
  - 'Stimulus module: Encapsulates write sequences to FIFO or register ports'
  - 'Monitor module: Captures read data and status flags passively'
  - 'Checker: Flags protocol violations (overflow, X on outputs, wrong opcode result)'
  notes: From MODULE4 Verification & Testing Methods.
- type: bullets
  title: 2. Scenario-based testing
  bullets:
  - 'Scenarios: Reset + fill FIFO; ALU op sweep; register R/W hazard patterns'
  - 'Tasks/methods: Each scenario is a callable task — reusable across tests'
  - 'Aggregation: Single report summarizing scenarios run and failures'
  notes: From MODULE4 Verification & Testing Methods.
- type: bullets
  title: 3. Structured debug and closure
  bullets:
  - 'Modular debug: Isolate failing agent by disabling others in top TB'
  - 'Waveform on demand: Trigger dumps only when checker fires'
  - 'Regression: `./scripts/module4.sh --self-checking` and `--all-tests` for batch
    sign-off'
  notes: From MODULE4 Verification & Testing Methods.
