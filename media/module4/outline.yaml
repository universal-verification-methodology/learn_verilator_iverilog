- type: section
  title: Common pitfalls
  narration: 'Next section: Common pitfalls.'
- type: bullets
  title: Mixing Concerns
  bullets:
  - Don't combine stimulus and checking in the same module/class
  - Don't drive signals from monitor or checker components
  notes: From MODULE4 Common Pitfalls.
  narration: Mixing Concerns. Don't combine stimulus and checking in the same module/class
    Don't drive signals from monitor or checker components
- type: bullets
  title: Hardcoded Values
  bullets:
  - Use parameters/constants for timing and configuration
  - Avoid magic numbers in code
  notes: From MODULE4 Common Pitfalls.
  narration: Hardcoded Values. Use parameters/constants for timing and configuration
    Avoid magic numbers in code
- type: bullets
  title: Insufficient Checking
  bullets:
  - Don't rely on manual inspection of waveforms
  - Always implement automatic checking
  notes: From MODULE4 Common Pitfalls.
  narration: Insufficient Checking. Don't rely on manual inspection of waveforms Always
    implement automatic checking
- type: bullets
  title: Poor Error Messages
  bullets:
  - Include enough context to debug failures
  - Use consistent error message format
  notes: From MODULE4 Common Pitfalls.
  narration: Poor Error Messages. Include enough context to debug failures Use consistent
    error message format
- type: bullets
  title: Inadequate Documentation
  bullets:
  - Document component purpose and interfaces
  - Explain complex logic and timing relationships
  notes: From MODULE4 Common Pitfalls.
  narration: Inadequate Documentation. Document component purpose and interfaces Explain
    complex logic and timing relationships
