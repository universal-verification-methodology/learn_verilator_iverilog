- type: bullets
  title: Overview
  bullets:
  - This module covers procedural testbench writing using Verilog's procedural blocks
    and C++ control structures. You'll learn to create complex test sequences, handle
    timing, and implement procedural verification patterns i
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 5: DUT / block hierarchy (see module5/examples/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 5: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. Protocol-oriented DUT (Module 5)
  bullets:
  - '`dut/uart/simple_uart.v`: TX FSM — idle, start, data bits, stop; `tx_done` handshake'
  - 'Clock domain: Single `clk` with active-low `rst_n`; serial `tx` output'
  - 'Future DUTs: SPI/I2C examples extend the same procedural TB patterns'
  - 'Interface contract: `tx_start` pulse, `tx_data[7:0]`, wait for `tx_done` before
    next byte'
  notes: From MODULE5 Design Architecture.
- type: bullets
  title: 2. Procedural testbench control architecture
  bullets:
  - 'Verilog: `initial` sequences call tasks; `always` blocks for clock and monitors'
  - 'C++: `main` or test class methods encode multi-step protocols with loops and
    waits'
  - 'Timing: `#delay` (Verilog) or counted `eval()` cycles (Verilator) align to bit
    times'
  - 'State alignment: TB FSM tracks UART phases while DUT FSM runs in RTL'
  notes: From MODULE5 Design Architecture.
- type: bullets
  title: 3. Reusable routine layer
  bullets:
  - 'Tasks/functions: `send_byte`, `wait_tx_done`, `apply_reset` — shared across tests'
  - 'C++ helpers: Same operations as methods on a `UartDriver` helper class'
  - 'File-driven layer: Sequences can be loaded from vector files for long regressions'
  notes: From MODULE5 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 5: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Sequence-based stimulus
  bullets:
  - 'Multi-step tests: Reset → configure → send N bytes → check `tx` bit timing'
  - 'Handshaking: Poll `tx_done` or use timeout counters to detect stuck FSM'
  - 'Negative tests: Start without reset, back-to-back `tx_start` — expect defined
    errors'
  notes: From MODULE5 Verification & Testing Methods.
- type: bullets
  title: 2. Timing and synchronization checks
  bullets:
  - 'Bit period: Verify one `eval()` or time step per bit cell in examples'
  - 'Setup/hold: Ensure `tx_data` stable before `tx_start` per README contracts'
  - 'Waveform review: UART frame visible on `tx` in VCD — start bit, LSB-first data'
  notes: From MODULE5 Verification & Testing Methods.
- type: bullets
  title: 3. Reuse and regression methodology
  bullets:
  - 'Routine library: Centralize protocol steps; tests only describe high-level scenarios'
  - 'File I/O regression: Replay captured stimulus files across tool releases'
  - 'Orchestration: `./scripts/module5.sh --test-sequences` and `--file-io` for focused
    runs'
  notes: From MODULE5 Verification & Testing Methods.
