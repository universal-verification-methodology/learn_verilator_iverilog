- type: two_column
  title: 1. Sequence-based stimulus
  left:
  - 'Multi-step tests: Reset → configure → send N bytes → check `tx` bit timing'
  - 'Handshaking: Poll `tx_done` or use timeout counters to detect stuck FSM'
  - 'Negative tests: Start without reset, back-to-back `tx_start` — expect defined
    errors'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE5 Verification & Testing Methods.
  narration: '1. Sequence-based stimulus. Multi-step tests: Reset → configure → send
