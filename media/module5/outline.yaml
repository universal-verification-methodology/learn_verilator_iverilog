- type: code
  title: Task/function Makefile
  language: makefile
  source_file: module5/examples/reusable_routines/Makefile
  code: "task_function_test_verilog: task_function_test_verilog.v\n\t@echo \"=== Compiling\
    \ Verilog task/function example ===\"\n\t$(IVERILOG) -o task_function_test task_function_test_verilog.v\
    \ $(DUT_DIR)/alus/simple_alu.v\n\t@echo \"=== Running simulation ===\"\n\t$(VVP)\
    \ task_function_test"
  notes: Links ALU DUT; vvp runs procedural task-based test sequence.
  narration: Task/function Makefile. Review the code on screen and match it to files
    in the repository. Links ALU DUT; vvp runs procedural task-based test sequence.
- type: code
  title: Task — apply stimulus and check
  language: systemverilog
  source_file: module5/examples/reusable_routines/task_function_test_verilog.v
  code: "    task test_alu_operation;\n        input [7:0] a_val, b_val;\n       \
    \ input [1:0] op_val;\n        begin\n            // Get operation name from op\
    \ code\n            task_op_name = get_op_name(op_val);\n            \n      \
    \      // Step 1: Apply test vector to DUT inputs\n            // This drives\
    \ the DUT with the test stimulus\n            a = a_val;\n            b = b_val;\n\
    \            op = op_val;\n            \n            // Step 2: Wait for combinational\
    \ logic to propagate\n            // #5 delay ensures output has stabilized before\
    \ checking\n            // For sequential logic, would wait for clock edge instead\n\
    \            #5;\n            \n// ..."
  notes: 'test_alu_operation task: drive inputs, #delay, compare, log result.'
  narration: 'Task — apply stimulus and check. Review the code on screen and match
    it to files in the repository. test_alu_operation task: drive inputs, #delay,
    compare, log result.'
- type: code
  title: Function — expected ALU result
  language: systemverilog
  source_file: module5/examples/reusable_routines/task_function_test_verilog.v
  code: "    function [7:0] calculate_expected;\n        input [7:0] a_val, b_val;\n\
    \        input [1:0] op_val;\n        begin\n            // Case statement implements\
    \ operation selection\n            // This is a common pattern for ALU operations\n\
    \            case (op_val)\n                2'b00: calculate_expected = a_val\
    \ + b_val;  // ADD: arithmetic addition\n                2'b01: calculate_expected\
    \ = a_val - b_val;  // SUB: arithmetic subtraction\n                2'b10: calculate_expected\
    \ = a_val & b_val;  // AND: bitwise AND\n                2'b11: calculate_expected\
    \ = a_val | b_val;  // OR: bitwise OR\n                default: calculate_expected\
    \ = 8'h00;  // Default: return 0 for invalid op\n            endcase\n       \
    \ end\n    endfunction"
  notes: calculate_expected encodes reference model for each opcode.
  narration: Function — expected ALU result. Review the code on screen and match it
    to files in the repository. calculate_expected encodes reference model for each
    opcode.
