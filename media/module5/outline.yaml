    to detect stuck FSM Negative tests: Start without reset, back-to-back tx_start
    — expect defined errors Refer to the diagram on the right.'
- type: two_column
  title: 2. Timing and synchronization checks
  left:
  - 'Bit period: Verify one `eval()` or time step per bit cell in examples'
  - 'Setup/hold: Ensure `tx_data` stable before `tx_start` per README contracts'
  - 'Waveform review: UART frame visible on `tx` in VCD — start bit, LSB-first data'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE5 Verification & Testing Methods.
  narration: '2. Timing and synchronization checks. Bit period: Verify one eval()
