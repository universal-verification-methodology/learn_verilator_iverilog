    );\n            $display(\"Running ALU Test Suite\");\n            $display(\"\
    ========================================\");\n            \n            // Test\
    \ ADD\n            test_alu_operation(8'h10, 8'h20, 2'b00);\n            test_alu_operation(8'hFF,\
    \ 8'h01, 2'b00);\n            \n            // Test SUB\n            test_alu_operation(8'h30,\
    \ 8'h10, 2'b01);\n            test_alu_operation(8'h00, 8'h01, 2'b01);\n     \
    \       \n            // Test AND\n            test_alu_operation(8'hAA, 8'h55,\
    \ 2'b10);\n            test_alu_operation(8'hFF, 8'hFF, 2'b10);\n            \n\
    \            // Test OR\n// ..."
