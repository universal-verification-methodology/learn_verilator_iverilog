slides:
- type: title
  title: Module 5
  subtitle: Procedural Testbench Writing
  narration: Welcome to module 5, Procedural Testbench Writing. In this module you
    will master procedural testbench construction using verilog procedural blocks
    and c++ control flow.
- type: bullets
  title: Learning objectives
  bullets:
  - 'Procedural Constructs: Master `initial` and `always` blocks in Verilog, and control
    flow in C++'
  - 'Timing Control: Understand delay control, event control, and wait statements'
  - 'Reusable Routines: Create tasks/functions in Verilog and functions/classes in
    C++ for code organization'
  - 'File I/O: Read test vectors from files and write results for automated testing'
  - 'Test Sequences: Build complex, multi-step test sequences'
  - 'Advanced Patterns: Implement state machines, protocols, and transaction-based
    testbenches'
  narration: 'Here is what you will learn in this module. Procedural Constructs: Master
    initial and always blocks in Verilog, and control flow in C++ Timing Control:
    Understand delay control, event control, and wait statements Reusable Routines:
    Create tasks/functions in Verilog and functions/classes in C++ for code organization
    File I/O: Read test vectors from files and write results for automated testing...'
