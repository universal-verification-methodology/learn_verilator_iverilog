- type: code
  title: File I/O regression build
  language: makefile
  source_file: module5/examples/file_io/Makefile
  code: "# Makefile for file I/O examples\n\nIVERILOG = iverilog\nVVP = vvp\nVERILATOR\
    \ = verilator\nDUT_DIR = ../../../module4/dut\n\nall: file_based_test_verilog\
    \ file_based_test_cpp\n\nfile_based_test_verilog: file_based_test_verilog.v test_vectors.hex\
    \ expected_results.hex\n\t@echo \"=== Compiling Verilog file-based testbench ===\"\
    \n\t$(IVERILOG) -o file_based_test file_based_test_verilog.v $(DUT_DIR)/alus/simple_alu.v\n\
    \t@echo \"=== Running simulation ===\"\n\t$(VVP) file_based_test\n\t@echo \"===\
    \ Checking output file ===\"\n\t@if [ -f test_results.txt ]; then \\\n\t\techo\
    \ \"Results file created:\"; \\\n\t\thead -15 test_results.txt; \\"
  notes: cd module5/examples/file_io && make — reads vectors from file.
  narration: File I/O regression build. Review the code on screen and match it to
    files in the repository. cd module5/examples/file_io && make — reads vectors from
    file.
- type: code
  title: File read and test loop
  language: systemverilog
  source_file: module5/examples/file_io/file_based_test_verilog.v
  code: "    /**\n     * Main Test Sequence\n     * \n     * This initial block orchestrates\
    \ the file-based testbench:\n     * 1. Read test vectors from input files\n  \
    \   * 2. Open output file for results\n     * 3. Apply test vectors and check\
    \ results\n     * 4. Write results to file\n     * 5. Close file and finish\n\
    \     * \n     * File I/O in Verilog:\n     * - $readmemh: Read hex format file\
    \ into memory array\n     * - $readmemb: Read binary format file into memory array\n\
    \     * - $fopen: Open file for writing (returns file handle)\n     * - $fwrite:\
    \ Write formatted data to file\n     * - $fclose: Close file handle\n     * \n\
    \     * Benefits of file-based testing:\n// ..."
  notes: $fopen/$fscanf load vectors; loop until EOF; write results log.
  narration: File read and test loop. Review the code on screen and match it to files
    in the repository. $fopen/$fscanf load vectors; loop until EOF; write results
    log.
