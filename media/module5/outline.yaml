- type: two_column
  title: 1. Protocol-oriented DUT (Module 5)
  left:
  - '`dut/uart/simple_uart.v`: TX FSM — idle, start, data bits, stop; `tx_done` handshake'
  - 'Clock domain: Single `clk` with active-low `rst_n`; serial `tx` output'
  - 'Future DUTs: SPI/I2C examples extend the same procedural TB patterns'
  - 'Interface contract: `tx_start` pulse, `tx_data[7:0]`, wait for `tx_done` before
    next byte'
  right: assets/diagrams/rtl_architecture.png
  notes: From MODULE5 Design Architecture.
  narration: '1. Protocol-oriented DUT (Module 5). dut/uart/simple_uart.v: TX FSM
    — idle, start, data bits, stop; tx_done handshake Clock domain: Single clk with
    active-low rst_n; serial tx output Future DUTs: SPI/I2C examples extend the same
    procedural TB patterns Interface contract: tx_start pulse, tx_data[7:0], wait
    for tx_done before next byte Refer to the diagram on the right.'
- type: two_column
  title: 2. Procedural testbench control architecture
  left:
  - 'Verilog: `initial` sequences call tasks; `always` blocks for clock and monitors'
  - 'C++: `main` or test class methods encode multi-step protocols with loops and
    waits'
  - 'Timing: `#delay` (Verilog) or counted `eval()` cycles (Verilator) align to bit
    times'
  - 'State alignment: TB FSM tracks UART phases while DUT FSM runs in RTL'
  right: assets/diagrams/verification_architecture.png
  notes: From MODULE5 Design Architecture.
  narration: '2. Procedural testbench control architecture. Verilog: initial sequences
    call tasks; always blocks for clock and monitors C++: main or test class methods
    encode multi-step protocols with loops and waits Timing: #delay (Verilog) or counted
    eval() cycles (Verilator) align to bit times State alignment: TB FSM tracks UART
    phases while DUT FSM runs in RTL Refer to the diagram on the right.'
- type: two_column
  title: 3. Reusable routine layer
  left:
  - 'Tasks/functions: `send_byte`, `wait_tx_done`, `apply_reset` — shared across tests'
  - 'C++ helpers: Same operations as methods on a `UartDriver` helper class'
  - 'File-driven layer: Sequences can be loaded from vector files for long regressions'
  right: assets/diagrams/testing_methods.png
  notes: From MODULE5 Design Architecture.
  narration: '3. Reusable routine layer. Tasks/functions: send_byte, wait_tx_done,
    apply_reset — shared across tests C++ helpers: Same operations as methods on a
