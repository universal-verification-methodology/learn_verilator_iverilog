- type: code
  title: Constraint randomization
  language: systemverilog
  source_file: module6/examples/randomization/randomized_testbench.sv
  code: "/**\n * Randomized Testbench - SystemVerilog (iverilog)\n * \n * This example\
    \ demonstrates constrained randomization, a powerful verification technique\n\
    \ * inspired by UVM (Universal Verification Methodology). Constrained randomization\
    \ allows\n * you to generate large numbers of test vectors automatically while\
    \ ensuring they meet\n * specific requirements through constraints.\n * \n * Learning\
    \ Objectives:\n * - Understand SystemVerilog randomization (rand, randc keywords)\n\
    \ * - Learn constraint-based randomization (constraint blocks)\n * - Master post_randomize()\
    \ callback for derived value calculation\n * - Understand seed control for reproducible\
    \ random tests\n * - Learn random test generation strategies\n * \n * UVM Concepts\
    \ Demonstrated:\n * - Constrained Random Verification (CRV): Core UVM methodology\n\
    \ * - Constraint blocks: Define valid value ranges (similar to UVM constraint\
    \ blocks)\n// ..."
  notes: randomize() with constraints; rerun for varied legal stimulus.
  narration: Constraint randomization. Review the code on screen and match it to files
    in the repository. randomize() with constraints; rerun for varied legal stimulus.
