- type: code
  title: Interface-based TB build
  language: makefile
  source_file: module6/examples/interfaces/Makefile
  code: "# Makefile for interface examples\n\nIVERILOG = iverilog\nVVP = vvp\nVERILATOR\
    \ = verilator\nDUT_DIR = ../../dut\n\nall: interface_based_testbench interface_based_testbench_cpp\n\
    \n# SystemVerilog interface-based testbench (iverilog)\ninterface_based_testbench:\
    \ interface_based_testbench.sv\n\t@echo \"=== Compiling SystemVerilog interface-based\
    \ testbench (iverilog) ===\"\n\t$(IVERILOG) -g2012 -o interface_based_testbench\
    \ interface_based_testbench.sv $(DUT_DIR)/simple_gates/and_gate.v\n\t@echo \"\
    === Running simulation ===\"\n\t$(VVP) interface_based_testbench\n\n# C++ equivalent\
    \ for Verilator\ninterface_based_testbench_cpp: interface_based_testbench_cpp.cpp\n\
    // ..."
  notes: Compile interface + TB + DUT; vvp runs class-driven test.
  narration: Interface-based TB build. Review the code on screen and match it to files
    in the repository. Compile interface + TB + DUT; vvp runs class-driven test.
