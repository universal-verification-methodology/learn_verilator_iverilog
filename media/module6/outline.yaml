- type: code
  title: SV compile — iverilog -g2012
  language: makefile
  source_file: module6/examples/sv_classes/Makefile
  code: "class_based_testbench: class_based_testbench.sv\n\t@echo \"=== Compiling\
    \ SystemVerilog class-based testbench (iverilog) ===\"\n\t$(IVERILOG) -g2012 -o\
    \ class_based_testbench class_based_testbench.sv $(DUT_DIR)/simple_gates/and_gate.v\n\
    \t@echo \"=== Running simulation ===\"\n\t$(VVP) class_based_testbench"
  notes: SystemVerilog classes require -g2012; package order matters.
  narration: SV compile — iverilog -g2012. Review the code on screen and match it
    to files in the repository. SystemVerilog classes require -g2012; package order
    matters.
- type: code
  title: Transaction class definition
  language: systemverilog
  source_file: module6/examples/sv_classes/class_based_testbench.sv
  code: "class transaction;\n    // Randomizable input signals (can be randomized\
    \ with randomize() method)\n    // rand keyword makes these variables eligible\
    \ for constrained randomization\n    rand bit a;  // First input to AND gate\n\
    \    rand bit b;  // Second input to AND gate\n    \n    // Non-randomizable output\
    \ (calculated, not randomized)\n    bit expected;  // Expected output value (calculated\
    \ in post_randomize)\n    \n    /**\n     * Constructor - Called automatically\
    \ when object is created\n     * \n     * Initializes all class properties to\
    \ default values.\n     * In SystemVerilog, new() is the constructor function.\n\
    \     * \n     * Usage: transaction tr = new();  // Creates new transaction object\n\
    \     */\n    function new();\n// ..."
  notes: rand fields, post_randomize(), new() — UVM sequence_item pattern.
  narration: Transaction class definition. Review the code on screen and match it
    to files in the repository. rand fields, post_randomize(), new() — UVM sequence_item
    pattern.
- type: code
  title: Interface — signal bundle
  language: systemverilog
  source_file: module6/examples/interfaces/interface_based_testbench.sv
  code: "/**\n * AND Gate Interface Definition\n * \n * This interface encapsulates\
    \ all signals for the AND gate:\n * - Input signals: a, b\n * - Output signal:\
    \ y\n * \n * Interfaces provide:\n * 1. Signal grouping: Related signals in one\
    \ place\n * 2. Direction control: Modports define who can drive/read which signals\n\
    \ * 3. Reusability: Same interface can be used in multiple testbenches\n * \n\
    \ * UVM Pattern: Similar to UVM virtual interfaces, which allow classes\n * to\
    \ access RTL signals through interface handles.\n */\ninterface and_gate_if;\n\
    \    // Interface signals (no direction specified here)\n    // Direction is controlled\
    \ by modports below\n// ..."
  notes: interface and_gate_if; modport driver and monitor directions.
  narration: Interface — signal bundle. Review the code on screen and match it to
    files in the repository. interface and_gate_if; modport driver and monitor directions.
