- type: code
  title: Assertion summary before $finish
  language: systemverilog
  source_file: module7/examples/assertions/basic_assertions_verilog.v
  code: "        // Print assertion summary\n        $display(\"\");\n        $display(\"\
    ========================================\");\n        $display(\"Assertion Summary\"\
    );\n        $display(\"========================================\");\n        $display(\"\
    Total assertions:  %0d\", assertion_count);\n        $display(\"Passed:      \
    \       %0d\", assertion_pass);\n        $display(\"Failed:             %0d\"\
    , assertion_fail);\n        $display(\"========================================\"\
    );\n        \n        if (assertion_fail == 0) begin\n            $display(\"\
    ✓ All assertions PASSED!\");\n        end else begin\n            $display(\"\
    ✗ Some assertions FAILED!\");\n        end\n        \n        $display(\"========================================\"\
    );\n        #20;\n// ..."
  notes: Print assertion_pass/fail totals; non-zero fail → debug waveforms.
  narration: Assertion summary before $finish. Review the code on screen and match
    it to files in the repository. Print assertion_pass/fail totals; non-zero fail
    → debug waveforms.
