- type: code
  title: Reset assertion property
  language: systemverilog
  source_file: module7/examples/assertions/basic_assertions_verilog.v
  code: "    // Assertion: Reset should clear counter\n    always @(posedge clk) begin\n\
    \        if (!rst_n) begin\n            assertion_count = assertion_count + 1;\n\
    \            if (count == 4'b0000) begin\n                assertion_pass = assertion_pass\
    \ + 1;\n                $display(\"[ASSERT PASS] Reset assertion: count is 0 when\
    \ rst_n=0\");\n            end else begin\n                assertion_fail = assertion_fail\
    \ + 1;\n                $display(\"[ASSERT FAIL] Reset assertion: count should\
    \ be 0 when rst_n=0, got %0d\", count);\n            end\n        end\n    end"
  notes: When !rst_n, count must be 0; log ASSERT PASS or FAIL.
  narration: Reset assertion property. Review the code on screen and match it to files
    in the repository. When !rst_n, count must be 0; log ASSERT PASS or FAIL.
