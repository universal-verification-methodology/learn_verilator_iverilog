- type: bullets
  title: Prerequisites
  bullets:
  - See module README
- type: image
  title: Learning path
  image: assets/diagrams/learning_path.png
  caption: Master basic coverage analysis and assertion-based verification without
    SystemVerilog dependencies
- type: bullets
  title: Overview
  bullets:
  - This module covers fundamental coverage analysis and assertion-based verification
    using basic Verilog and C++ constructs. You'll learn to measure verification completeness,
    write simple assertions, and use coverage to gu
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 7: DUT / block hierarchy (see module7/examples/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 7: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. Observability-focused DUT set
  bullets:
  - '`dut/simple_gates/`, `dut/multiplexers/`, `dut/counters/`: Familiar blocks for
    assertion and coverage labs'
  - 'Checkpoints: Internal signals (count, select, flags) exposed for bind-style or
    inline assertions'
  - 'Tool split: Assertions in SV/Verilog for iverilog; C++ `assert` paths in Verilator
    examples'
  notes: From MODULE7 Design Architecture.
- type: bullets
  title: 2. Assertion architecture
  bullets:
  - 'Immediate assertions: `$display` + `if` checks in procedural TB (baseline)'
  - 'Concurrent-style patterns: Properties described in examples where SVA subset
    supported'
  - 'Assertion libraries: Reusable check macros/modules in `assertion_libraries/`
    examples'
  - 'Failure action: `$error` / `fatal` or abort simulation with non-zero status'
  notes: From MODULE7 Design Architecture.
- type: bullets
  title: 3. Coverage model architecture
  bullets:
  - 'Functional coverage points: User-defined bins on opcodes, states, or cross terms'
  - 'Code coverage: Line/branch awareness via simulator reports where available'
  - 'Feedback loop: Coverage holes drive new directed or random tests (documented
    in guides)'
  notes: From MODULE7 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 7: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Assertion-based verification (ABV)
  bullets:
  - 'Property targets: Reset behavior, one-hot select, counter monotonicity, no X
    on outputs'
  - 'Assume/guarantee mindset: Environment assumptions vs DUT guarantees in examples'
  - 'Debug: Assertion name and time stamp in failure message — rerun with VCD at failure
    cycle'
  notes: From MODULE7 Verification & Testing Methods.
- type: bullets
  title: 2. Coverage-driven closure
  bullets:
  - 'Goals: Target 100% on critical crosses; accept waived bins with documented rationale'
  - 'Sampling: Coverpoints updated each transaction or clock in TB code'
  - 'Reports: Text summaries from `coverage_analysis` examples — gap list for next
    tests'
  notes: From MODULE7 Verification & Testing Methods.
- type: bullets
  title: 3. Metrics and sign-off prep
  bullets:
  - 'Pass/fail plus coverage: Exit criteria require zero assertion failures and met
    coverage goals'
  - 'Regression: Re-run assertion suite after RTL/TB edits — `./scripts/module7.sh
    --check`'
  - 'Bridge to Module 8: Metrics feed verification plan and sign-off checklist'
  notes: From MODULE7 Verification & Testing Methods.
