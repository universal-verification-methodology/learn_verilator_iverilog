- type: code
  title: Assertions Makefile — compile DUT+TB
  language: makefile
  source_file: module7/examples/assertions/Makefile
  code: "basic_assertions_verilog: basic_assertions_verilog.v\n\t@echo \"=== Compiling\
    \ Verilog assertions example ===\"\n\t$(IVERILOG) -g2012 -o basic_assertions basic_assertions_verilog.v\
    \ $(DUT_DIR)/counters/counter_4bit.v\n\t@echo \"=== Running simulation ===\"\n\
    \t$(VVP) basic_assertions"
  notes: iverilog -g2012 links counter DUT with assertion TB.
  narration: Assertions Makefile — compile DUT+TB. Review the code on screen and match
    it to files in the repository. iverilog -g2012 links counter DUT with assertion
    TB.
- type: code
  title: Clocked assertion check
  language: systemverilog
  source_file: module7/examples/assertions/basic_assertions_verilog.v
  code: "    // Clock generation\n    initial begin\n        clk = 0;\n        forever\
    \ #10 clk = ~clk;\n    end\n    \n    // Assertion: Reset should clear counter\n\
    \    always @(posedge clk) begin\n        if (!rst_n) begin\n            assertion_count\
    \ = assertion_count + 1;\n            if (count == 4'b0000) begin\n          \
    \      assertion_pass = assertion_pass + 1;\n                $display(\"[ASSERT\
    \ PASS] Reset assertion: count is 0 when rst_n=0\");\n            end else begin\n\
    \                assertion_fail = assertion_fail + 1;\n                $display(\"\
    [ASSERT FAIL] Reset assertion: count should be 0 when rst_n=0, got %0d\", count);\n\
    \            end\n        end\n// ..."
  notes: always @(posedge clk) verify property; count pass/fail.
  narration: Clocked assertion check. Review the code on screen and match it to files
    in the repository. always @(posedge clk) verify property; count pass/fail.
- type: code
  title: DUT under assertion test
  language: systemverilog
  source_file: module7/examples/assertions/basic_assertions_verilog.v
  code: "    // Instantiate DUT\n    counter_4bit dut (\n        .clk(clk),\n    \
    \    .rst_n(rst_n),\n        .en(en),\n        .count(count)\n    );"
  notes: counter_4bit instantiated; assertions observe count and reset.
  narration: DUT under assertion test. Review the code on screen and match it to files
    in the repository. counter_4bit instantiated; assertions observe count and reset.
