- type: code
  title: Tool selection criteria
  language: markdown
  source_file: module8/examples/tool_selection/tool_comparison_guide.md
  code: '# Tool Selection and Integration Guide


    This guide helps you choose between iverilog and Verilator for your verification
    projects.


    ## When to Use iverilog


    ### Advantages

    - **Full Verilog/SystemVerilog Support**: Supports most Verilog and SystemVerilog
    features

    - **Standard Compliance**: Better compliance with IEEE standards

    - **Interactive Debugging**: Better support for interactive debugging

    - **Waveform Generation**: Built-in VCD generation

    - **SystemVerilog Features**: Supports classes, interfaces, packages, etc.


    ### Best For

    - SystemVerilog testbenches

    - Complex verification environments

    - Learning and education

    - Projects requiring full SystemVerilog features

    // ...'
  notes: When iverilog vs Verilator; SV feature needs vs performance.
  narration: Tool selection criteria. Review the code on screen and match it to files
    in the repository. When iverilog vs Verilator; SV feature needs vs performance.
