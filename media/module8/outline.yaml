- type: code
  title: Metrics tracker build
  language: makefile
  source_file: module8/examples/verification_metrics/Makefile
  code: "# Makefile for verification metrics examples\n\nIVERILOG = iverilog\nVVP\
    \ = vvp\nVERILATOR = verilator\nDUT_DIR = ../../dut\n\nall: metrics_tracker_verilog\
    \ metrics_tracker_cpp\n\nmetrics_tracker_verilog: metrics_tracker_verilog.v\n\t\
    @echo \"=== Compiling Verilog metrics tracker example ===\"\n\t$(IVERILOG) -o\
    \ metrics_tracker metrics_tracker_verilog.v $(DUT_DIR)/simple_gates/and_gate.v\n\
    \t@echo \"=== Running simulation ===\"\n\t$(VVP) metrics_tracker\n\nmetrics_tracker_cpp:\
    \ metrics_tracker_cpp.cpp\n\t@echo \"=== Compiling C++ metrics tracker example\
    \ ===\"\n\t$(VERILATOR) --cc --exe --build -I$(DUT_DIR)/simple_gates \\"
