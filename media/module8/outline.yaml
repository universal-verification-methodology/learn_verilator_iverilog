- type: bullets
  title: Prerequisites
  bullets:
  - See module README
- type: image
  title: Learning path
  image: assets/diagrams/learning_path.png
  caption: Master verification methodology and industry best practices
- type: bullets
  title: Overview
  bullets:
  - This module focuses on verification methodology, best practices, and preparing
    for real-world verification projects. You'll learn about test planning, verification
    metrics, documentation, and verification sign-off.
- type: section
  title: Design architecture
- type: image
  title: RTL / block architecture
  image: assets/diagrams/rtl_architecture.png
  caption: 'Module 8: DUT / block hierarchy (see module8/examples/).'
- type: image
  title: Verification environment architecture
  image: assets/diagrams/verification_architecture.png
  caption: 'Module 8: UVM layers, agents, and checkers for this phase.'
- type: bullets
  title: 1. End-to-end verification program architecture
  bullets:
  - 'DUT portfolio: Gates, counters, multiplexers — representative of prior modules'
  - 'TB styles: Modular Verilog TBs and C++ Verilator TBs under `tests/`'
  - 'Knowledge base: Guides in `examples/` (planning, metrics, sign-off, industry
    practices)'
  - 'Automation: `./scripts/module8.sh` orchestrates methodology demos, not just RTL
    compiles'
  notes: From MODULE8 Design Architecture.
- type: bullets
  title: 2. Layered testbench architecture (production pattern)
  bullets:
  - 'Test layer: Selects scenario, configures plusargs, sets pass criteria'
  - 'Environment layer: Agents, scoreboard, coverage collectors — reusable per project'
  - 'DUT layer: RTL with assertions and optional bind modules'
  - 'Tool layer: Simulator choice (iverilog vs Verilator) per block complexity and
    SV needs'
  notes: From MODULE8 Design Architecture.
- type: bullets
  title: 3. Verification infrastructure
  bullets:
  - 'Regression shell: Scripts batch examples; logs archived for trend analysis'
  - 'Documentation: Test plans, coding standards, tool comparison guides in-repo'
  - 'Metrics store: Example formats for coverage/assertion summaries before sign-off'
  notes: From MODULE8 Design Architecture.
- type: section
  title: Verification & testing methods
- type: image
  title: Testing and closure flow
  image: assets/diagrams/testing_methods.png
  caption: 'Module 8: how tests, checks, and metrics close verification goals.'
- type: bullets
  title: 1. Verification planning and strategy
  bullets:
  - 'Test plan: Features → test cases → priority → owner → status'
  - 'Strategy selection: Directed vs random vs assertion-heavy per risk area'
  - 'Entry/exit criteria: Definition of done per milestone (smoke, feature, full regression)'
  notes: From MODULE8 Verification & Testing Methods.
- type: bullets
  title: 2. Metrics, regression, and debug methodology
  bullets:
  - 'Metrics: Functional coverage, assertion pass rate, test count, bug find rate'
  - 'Regression: Nightly `./scripts/module8.sh` style runs; compare logs to golden'
  - 'Debug process: Reproduce → minimize → fix → add regression test (examples in
    `debugging_methodology/`)'
  notes: From MODULE8 Verification & Testing Methods.
- type: bullets
  title: 3. Sign-off and industry practice
  bullets:
  - 'Sign-off checklist: Coverage goals met, zero outstanding sev-1 assertions, plan
    executed'
  - 'Tool selection: Decision matrix (iverilog vs Verilator) from `tool_selection/`
    guide'
  - 'Maintainability: Coding standards and modular TB rules for team-scale projects'
  notes: From MODULE8 Verification & Testing Methods.
