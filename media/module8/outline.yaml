- type: code
  title: Modular TB Makefile
  language: makefile
  source_file: module8/examples/testbench_architecture/Makefile
  code: "modular_testbench_verilog: modular_testbench_verilog.v\n\t@echo \"=== Compiling\
    \ Verilog modular testbench example ===\"\n\t$(IVERILOG) -o modular_testbench\
    \ modular_testbench_verilog.v $(DUT_DIR)/multiplexers/mux_4to1.v\n\t@echo \"===\
    \ Running simulation ===\"\n\t$(VVP) modular_testbench"
  notes: Compiles reusable generator modules + mux DUT + top TB.
  narration: Modular TB Makefile. Review the code on screen and match it to files
    in the repository. Compiles reusable generator modules + mux DUT + top TB.
- type: code
  title: Reusable clock/reset generators
  language: systemverilog
  source_file: module8/examples/testbench_architecture/modular_testbench_verilog.v
  code: "// ============================================================================\n\
    // Clock Generator Module (Reusable)\n// ============================================================================\n\
    module clock_generator #(\n    parameter PERIOD = 20  // Clock period in ns\n\
    )(\n    output reg clk\n);\n    initial clk = 0;\n    always #(PERIOD/2) clk =\
    \ ~clk;\nendmodule\n\n// ============================================================================\n\
    // Reset Generator Module (Reusable)\n// ============================================================================\n\
    module reset_generator #(\n    parameter RESET_DURATION = 100  // Reset duration\
    \ in ns\n)(\n// ..."
  notes: Separate clock_generator and reset_generator parameterized modules.
  narration: Reusable clock/reset generators. Review the code on screen and match
    it to files in the repository. Separate clock_generator and reset_generator parameterized
    modules.
- type: code
  title: Top TB — wire agents to DUT
  language: systemverilog
  source_file: module8/examples/testbench_architecture/modular_testbench_verilog.v
  code: "module modular_testbench_verilog;\n    \n    // Parameters (Configurability)\n\
    \    parameter CLOCK_PERIOD = 20;\n    parameter RESET_DURATION = 100;\n    parameter\
    \ NUM_TESTS = 16;\n    \n    // Signals\n    wire clk;\n    wire rst_n;\n    wire\
    \ [1:0] sel;\n    wire [3:0] inputs;\n    wire out;\n    wire valid;\n    wire\
    \ done;\n    wire error;\n    \n    // Instantiate reusable modules\n// ..."
  notes: clk_gen, rst_gen, stim_gen, dut, monitor, checker, scoreboard hierarchy.
  narration: Top TB — wire agents to DUT. Review the code on screen and match it to
    files in the repository. clk_gen, rst_gen, stim_gen, dut, monitor, checker, scoreboard
    hierarchy.
