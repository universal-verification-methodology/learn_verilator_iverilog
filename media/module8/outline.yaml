- type: code
  title: Checker module — expected vs actual
  language: systemverilog
  source_file: module8/examples/testbench_architecture/modular_testbench_verilog.v
  code: "module checker (\n    input clk,\n    input rst_n,\n    input [1:0] sel,\n\
    \    input [3:0] inputs,\n    input out,\n    input valid,\n    output reg error\n\
    );\n    reg [3:0] expected;\n    \n    always @(*) begin\n        if (rst_n &&\
    \ valid) begin\n            case (sel)\n                2'b00: expected = inputs[0];\n\
    \                2'b01: expected = inputs[1];\n                2'b10: expected\
    \ = inputs[2];\n                2'b11: expected = inputs[3];\n// ..."
  notes: checker samples on posedge clk; $error on mismatch.
  narration: Checker module — expected vs actual. Review the code on screen and match
    it to files in the repository. checker samples on posedge clk; $error on mismatch.
